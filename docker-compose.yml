version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: findash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findash
      POSTGRES_PASSWORD: findash_dev_password
      POSTGRES_DB: findash
    ports:
      - "5432:5432"
    volumes:
      - findash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findash -d findash"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  findash_pgdata: