sonar.projectKey=David6462_FinDash_PT
sonar.organization=david6462
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# --- Exclusiones de cobertura ---
#
# src/main.ts: bootstrap de la app (crea el AppModule, configura pipes/CORS y
# hace listen). No tiene lógica de negocio y ya está excluido de la cobertura en
# jest.config.mjs (collectCoverageFrom -> '!src/main.ts'); lo replicamos aquí
# para que el número de Sonar coincida con el de Jest.
sonar.coverage.exclusions=src/main.ts
#
# Ruido conocido SIN exclusión posible: los constructores de inyección de
# dependencias con muchos parámetros (p. ej. TransferOrchestratorUseCase,
# PersistTransferStep y similares con 5+ dependencias inyectadas) hacen que
# TypeScript, con emitDecoratorMetadata activo, emita metadata de tipos por
# parámetro. Istanbul contabiliza esa metadata como "branches" del constructor
# que nunca se ejecutan en un sentido real, bajando el % de esos archivos.
# Es un artefacto del compilador, no código sin testear.
#
# Sonar solo permite excluir cobertura a nivel de ARCHIVO (glob), no "solo las
# líneas del constructor". Excluir transfer-orchestrator.use-case.ts o
# persist-transfer.step.ts completos sacrificaría la medición de su lógica real
# (orquestación de pasos, manejo de la carrera de idempotencia, rollback), que
# sí está y debe seguir cubierta por tests. Por eso NO se excluyen: se acepta
# esas líneas de constructor como ruido documentado, sin acción limpia posible
# en Sonar.
