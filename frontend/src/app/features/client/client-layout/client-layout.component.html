<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">◈</span>
      <span class="brand__name">FinDash</span>
    </div>

    <nav class="nav">
      <a routerLink="/client/transfer" routerLinkActive="nav__link--active" class="nav__link">
        Transferir
      </a>
      <a routerLink="/client/movements" routerLinkActive="nav__link--active" class="nav__link">
        Mis Movimientos
      </a>
    </nav>

    <div class="session">
      @if (accountStore.myAccount(); as account) {
        <span class="session__balance">
          Saldo: ${{ account.balance | number: '1.2-2' }}
        </span>
      }
      <span class="session__user">{{ authStore.user()?.documentNumber }}</span>
      <button type="button" class="session__logout" (click)="authStore.logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
