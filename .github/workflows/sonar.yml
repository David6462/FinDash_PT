name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest

    # test:cov:all corre los e2e, que levantan la app Nest real contra Postgres
    # (TypeORM con synchronize: true crea el esquema al arrancar).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: findash
          POSTGRES_PASSWORD: findash
          POSTGRES_DB: findash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: findash
      DB_PASSWORD: findash
      DB_NAME: findash_test
      JWT_SECRET: ci_only_not_a_real_secret
      JWT_EXPIRES_IN: 1h
      FRAUD_CHECK_TIMEOUT_MS: 3000
      FRAUD_CHECK_MIN_DELAY_MS: 0
      FRAUD_CHECK_MAX_DELAY_MS: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo (blame / detección de PRs),
          # no un shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        # Genera backend/coverage/lcov.info
        run: npm run test:cov:all

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          # sonar-project.properties vive en backend/, así que el scanner debe
          # tomar ese directorio como base del proyecto.
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
